name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # No `cache: pip` here: this job installs no pip deps (semantic-release
      # manages its own env), so the cache-save post-step would fail the job.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions[bot]"
          git_committer_email: "41898282+github-actions[bot]@users.noreply.github.com"

      # ---- Docker image asset (only when a new version was released) ----
      - name: Set up Docker Buildx
        if: steps.release.outputs.released == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build full-stack image
        if: steps.release.outputs.released == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .

      - name: Save image as release asset
        if: steps.release.outputs.released == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker save "$IMAGE:$VERSION" | gzip > "cbos-web-${VERSION}-docker-image.tar.gz"
          ls -lh cbos-web-*.tar.gz

      - name: Attach image to GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release upload "$TAG" "cbos-web-${VERSION}-docker-image.tar.gz" --clobber

      - name: Push image to GHCR
        if: steps.release.outputs.released == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
