name: Windows build

on:
  pull_request:
    branches: [main, 'fix/**', 'feature/**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows Server 2019 noninteractive build
    if: >-
      github.repository == 'kevinalliswell/coal-database-blending-system-web' &&
      github.event.repository.private == true &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type == 'User'))
    runs-on: [self-hosted, Windows, X64, local-windows, windows-build, coal-web]
    timeout-minutes: 45
    concurrency:
      group: windows-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: powershell
        working-directory: ${{ github.workspace }}/ci/${{ github.run_id }}-${{ github.run_attempt }}
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # System Git 2.9 cannot perform a real actions/checkout. Bootstrap portable
      # Git before checkout, without changing system PATH or installing software.
      - name: Verify service boundary and prepare portable Git
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          $osInfo = Get-CimInstance Win32_OperatingSystem
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64' -or [IntPtr]::Size -ne 8) { throw 'Expected Windows X64' }
          if ($identity.User.Value -ne 'S-1-5-20' -or $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Expected non-administrator NetworkService' }
          if ((Get-Process -Id $PID).SessionId -ne 0) { throw 'Expected noninteractive Session 0' }
          if ($osInfo.BuildNumber -ne '17763' -or $osInfo.ProductType -eq 1) { throw 'Expected Windows Server 2019' }
          $env:CI_TASK_ROOT = Join-Path $env:RUNNER_TEMP ('cbos-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          "CI_TASK_ROOT=$env:CI_TASK_ROOT" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force $env:CI_TASK_ROOT | Out-Null
          $cache = Join-Path (Split-Path -Parent $env:RUNNER_TEMP) '_cbos-package-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "CBOS_ARCHIVE_CACHE=$cache" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $zip = Join-Path $cache 'MinGit-2.55.0.5-64-bit.zip'
          if (!(Test-Path -LiteralPath $zip)) {
            $download = Join-Path $env:CI_TASK_ROOT 'mingit-download.zip'
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 180 -Uri 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip' -OutFile $download
            if ((Get-FileHash $download -Algorithm SHA256).Hash -ne '56d7b226b7693196cfc71fef26568f536c4a021ab6c37ff2db4287bed908e96e') { throw 'MinGit download checksum mismatch' }
            Move-Item -LiteralPath $download -Destination $zip
          }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '56d7b226b7693196cfc71fef26568f536c4a021ab6c37ff2db4287bed908e96e') { throw 'MinGit checksum mismatch' }
          $gitRoot = Join-Path $env:CI_TASK_ROOT 'git'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $gitRoot)
          $gitBin = Join-Path $gitRoot 'cmd'
          & (Join-Path $gitBin 'git.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitBin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          $meta = @{ runner=$env:RUNNER_NAME; os=$osInfo.Caption; os_build=$osInfo.BuildNumber; arch=$env:RUNNER_ARCH; account_sid=$identity.User.Value; session=0; administrator=$false; run_id=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT }
          $meta | ConvertTo-Json | Set-Content (Join-Path $env:CI_TASK_ROOT 'runner.json') -Encoding UTF8
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          path: ci/${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Prepare portable Node and Python with isolated build caches
        run: ./scripts/ci/windows-tools.ps1
      - name: Verify exact source and version manifests
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -ne $env:EXPECTED_SHA) { throw 'Checkout differs from requested SHA' }
          node -e "if (process.platform !== 'win32' || process.arch !== 'x64' || !process.versions.node.startsWith('22.')) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          "CBOS_BUILD_SHA=$sha" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "EXPECTED_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          python scripts/release.py verify-tree --sha $sha --version $version
      - name: Prepare optional verified dependency downloads
        run: python scripts/ci/dependency-cache.py
      - name: Install Python dependencies in the virtual environment
        run: python -m pip install -r requirements-dev.txt -r desktop/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install desktop build dependencies
        run: npm --prefix desktop ci
      - name: Python regressions
        id: pytest
        run: python -m pytest -q --junitxml=outputs/ci/pytest.xml
      - name: Frontend regressions
        id: frontend_tests
        run: node --test frontend/tests/*.test.mjs
      - name: Desktop-shell regressions
        id: shell_tests
        run: node --test desktop/tests/*.test.cjs
      - name: Frontend type check
        id: typecheck
        run: npm --prefix frontend run typecheck
      - name: Build web frontend
        id: web_build
        env:
          VITE_USE_MOCK: 'false'
        run: npm --prefix frontend run build
      - name: Build offline frontend
        id: offline_build
        env:
          VITE_USE_MOCK: 'false'
        run: npm --prefix frontend run build -- --mode desktop
      - name: Freeze backend
        id: freeze
        run: python desktop/scripts/build-backend.py
      - name: Frozen backend HTTP calculations and isolated database restart
        id: backend_smoke
        run: python desktop/scripts/smoke-backend.py --executable desktop/backend-dist/cbos-backend/cbos-backend.exe --output outputs/ci/backend
      - name: Build NSIS and ZIP without executing the installer
        id: package
        run: |
          if ($env:CBOS_ELECTRON_ZIP) {
            npm --prefix desktop run dist:win -- "--config.electronDist=$env:CBOS_ELECTRON_ZIP"
          } else {
            npm --prefix desktop run dist:win
          }
      - name: Record build evidence and verify embedded identity
        if: always()
        env:
          CHECK_RESULTS: >-
            {"python":"${{ steps.pytest.outcome }}","frontend":"${{ steps.frontend_tests.outcome }}",
             "desktop_shell":"${{ steps.shell_tests.outcome }}","typecheck":"${{ steps.typecheck.outcome }}",
             "web_build":"${{ steps.web_build.outcome }}","offline_build":"${{ steps.offline_build.outcome }}",
             "freeze":"${{ steps.freeze.outcome }}","backend_smoke":"${{ steps.backend_smoke.outcome }}",
             "package":"${{ steps.package.outcome }}"}
        run: python scripts/ci/windows-build-report.py
      - name: Clean only this run's source and tools
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          RUN_DIRECTORY: ci/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE $env:RUN_DIRECTORY
          if (Test-Path -LiteralPath $source) { Remove-Item -LiteralPath $source -Recurse -Force }
          if ($env:CI_TASK_ROOT -and (Test-Path -LiteralPath $env:CI_TASK_ROOT)) { Remove-Item -LiteralPath $env:CI_TASK_ROOT -Recurse -Force }
