name: CI

on:
  pull_request:
    branches: [main, 'fix/**', 'feature/**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Python regressions
        run: python -m pytest -q
      - name: Frontend and desktop-shell regressions
        run: |
          node --test frontend/tests/*.test.mjs
          node --test desktop/tests/*.test.cjs
      - run: npm run build
        working-directory: frontend
        env:
          VITE_USE_MOCK: 'false'
      - name: Resolve tested tree identity
        run: |
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VERSION=$(python -c 'from app.__version__ import __version__; print(__version__)')" >> "$GITHUB_ENV"
      - name: Build real Linux container
        run: docker build --platform linux/amd64 --build-arg BUILD_COMMIT="$BUILD_SHA" --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t cbos-ci:tested .
      - name: Validate fresh deployment and old-data upgrade through HTTP
        run: python scripts/smoke-docker.py --image cbos-ci:tested --output docker-ci-evidence --expected-commit "$BUILD_SHA" --expected-version "$VERSION" --expected-platform linux/amd64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-ci-${{ github.sha }}
          path: docker-ci-evidence/
          if-no-files-found: warn
