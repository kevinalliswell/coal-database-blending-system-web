<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>混煤优化历史 - 煤种数据库管理及配煤优化系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-gear-fill me-2"></i>煤种数据库管理及配煤优化系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i>首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/coal_management"><i class="bi bi-database me-1"></i>煤种数据</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/smart_blending"><i class="bi bi-cpu me-1"></i>智能混煤</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/replacement_ratio"><i class="bi bi-calculator me-1"></i>置换比计算</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-clock-history me-1"></i>优化历史
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item active" href="/optimization_history/blending">混煤优化历史</a></li>
                            <li><a class="dropdown-item" href="/optimization_history/replacement_ratio">置换比历史</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4 page-shell">
        <div class="page-hero card mb-4">
            <div class="page-hero__body">
                <div class="page-hero__content">
                    <div class="page-hero__eyebrow">Optimization Archive</div>
                    <h1 class="page-hero__title">混煤优化历史</h1>
                    <p class="page-hero__subtitle mb-0">按时间查看喷煤混煤优化结果，快速回顾煤种配比、关键指标以及当时的输入与结果快照。</p>
                </div>
                <div class="page-hero__meta">
                    <span class="page-hero__meta-label">历史入口</span>
                    <strong>数据库持久化记录</strong>
                    <div class="page-hero__meta-divider"></div>
                    <span class="page-hero__meta-label">切换视图</span>
                    <a href="/optimization_history/replacement_ratio" class="btn btn-outline-primary btn-sm mt-2">查看置换比历史</a>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-clock-history me-2"></i>历史列表</span>
                <button class="btn btn-sm btn-outline-light" id="refreshBlendingHistoryBtn">
                    <i class="bi bi-arrow-repeat me-1"></i>刷新
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>煤种与配比</th>
                                <th>总价</th>
                                <th>热值</th>
                                <th>灰分</th>
                                <th>硫分</th>
                                <th>可行性</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="blendingHistoryTableBody">
                            <tr>
                                <td colspan="8" class="text-center text-muted">正在加载历史记录...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="blendingHistoryDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">混煤历史详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="blendingHistoryDetailContent"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/optimization_history_blending.js') }}"></script>
</body>
</html>
