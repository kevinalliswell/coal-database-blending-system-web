<div class="row g-3">
    <div class="col-md-6">
        <label class="form-label">煤种名称 <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="name" required placeholder="输入煤种名称">
    </div>
    <div class="col-md-6">
        <label class="form-label">煤种类型 <span class="text-danger">*</span></label>
        <select class="form-select" name="type" required>
            <option value="">请选择类型</option>
            <option value="烟煤">烟煤</option>
            <option value="无烟煤">无烟煤</option>
            <option value="褐煤">褐煤</option>
            <option value="贫煤">贫煤</option>
            <option value="其他">其他</option>
        </select>
    </div>
    <div class="col-md-6">
        <label class="form-label">供应商/产地</label>
        <input type="text" class="form-control" name="supplier" placeholder="输入供应商或产地">
    </div>
    <div class="col-md-6">
        <label class="form-label">价格(元/吨) <span class="text-danger">*</span></label>
        <input type="number" class="form-control" name="price" required step="0.01" min="0" placeholder="输入价格">
    </div>
    <div class="col-12">
        <h6 class="form-section-title">技术指标</h6>
    </div>
    <div class="col-md-4">
        <label class="form-label">热值(kcal/kg) <span class="text-danger">*</span></label>
        <input type="number" class="form-control" name="calorific_value" required min="0" placeholder="输入热值">
    </div>
    <div class="col-md-4">
        <label class="form-label">灰分(%) <span class="text-danger">*</span></label>
        <input type="number" class="form-control" name="ash_content" required step="0.01" min="0" max="100" placeholder="输入灰分">
    </div>
    <div class="col-md-4">
        <label class="form-label">挥发分(%) <span class="text-danger">*</span></label>
        <input type="number" class="form-control" name="volatile_matter" required step="0.01" min="0" max="100" placeholder="输入挥发分">
    </div>
    <div class="col-md-4">
        <label class="form-label">固定碳(%) <span class="text-danger">*</span></label>
        <input type="number" class="form-control" name="fixed_carbon" required step="0.01" min="0" max="100" placeholder="输入固定碳">
    </div>
    <div class="col-md-4">
        <label class="form-label">全硫(%) <span class="text-danger">*</span></label>
        <input type="number" class="form-control" name="total_sulfur" required step="0.01" min="0" max="100" placeholder="输入全硫">
    </div>
    <div class="col-md-4">
        <label class="form-label">全水分(%)</label>
        <input type="number" class="form-control" name="moisture" step="0.01" min="0" max="100" placeholder="输入全水分">
    </div>
    <div class="col-md-4">
        <label class="form-label">空干基水分(%)</label>
        <input type="number" class="form-control" name="mad" step="0.01" min="0" max="100" placeholder="输入空干基水分">
    </div>
    <div class="col-12">
        <h6 class="form-section-title">其他指标</h6>
    </div>
    <div class="col-md-4">
        <label class="form-label">可磨性HGI</label>
        <input type="number" class="form-control" name="hgi" step="0.01" placeholder="输入可磨性">
    </div>
    <div class="col-md-4">
        <label class="form-label">燃尽率(%)</label>
        <input type="number" class="form-control" name="burnout_rate" step="0.01" min="0" max="100" placeholder="输入燃尽率">
    </div>
    <div class="col-md-4">
        <label class="form-label">含碳量C(%)</label>
        <input type="number" class="form-control" name="carbon_content" step="0.01" min="0" max="100" placeholder="输入含碳量">
    </div>
    <div class="col-md-4">
        <label class="form-label">含氢量H(%)</label>
        <input type="number" class="form-control" name="hydrogen_content" step="0.01" min="0" max="100" placeholder="输入含氢量">
    </div>
    <div class="col-md-4">
        <label class="form-label">含氮量N(%)</label>
        <input type="number" class="form-control" name="nitrogen_content" step="0.01" min="0" max="100" placeholder="输入含氮量">
    </div>
</div>
