<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器错误 - 煤种数据库管理及配煤优化系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
</head>
<body>
    <main class="error-page">
        <section class="error-panel" role="alert">
            <div class="error-panel__code">500</div>
            <div class="error-panel__icon" data-tone="danger"><i class="bi bi-exclamation-triangle"></i></div>
            <h1>服务器暂时无法完成请求</h1>
            <p>服务端处理时遇到错误。可以刷新重试，或回到首页检查当前服务状态。</p>
            <div class="error-panel__actions">
                <button type="button" class="btn btn-primary" id="reloadPageBtn">
                    <i class="bi bi-arrow-clockwise me-1"></i>刷新页面
                </button>
                <a href="{{ url_for('pages.index') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-house-door me-1"></i>返回首页
                </a>
            </div>
        </section>
    </main>
    <script>
        document.getElementById('reloadPageBtn')?.addEventListener('click', function () {
            window.location.reload();
        });
    </script>
</body>
</html>
