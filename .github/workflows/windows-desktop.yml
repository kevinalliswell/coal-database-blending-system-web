name: Windows desktop

on:
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      build_sha:
        description: 'Optional exact commit for validation'
        required: false
        type: string
      version:
        description: 'Expected prepared version'
        required: false
        type: string
  workflow_call:
    inputs:
      build_sha:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ inputs.build_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      # Playwright controls the Chromium embedded in Electron; no browser download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Require disposable hosted environment for installation and GUI acceptance
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Installation, upgrade, uninstall and GUI acceptance require an independent disposable test environment.'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve exact build identity
        id: identity
        env:
          EXPECTED_SHA: ${{ inputs.build_sha || github.event.pull_request.head.sha || github.sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($env:EXPECTED_SHA -and $sha -ne $env:EXPECTED_SHA) { throw 'Checkout does not match requested full SHA' }
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($env:EXPECTED_VERSION -and $version -ne $env:EXPECTED_VERSION) { throw 'Prepared version differs' }
          "sha=$sha" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "CBOS_BUILD_SHA=$sha" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            desktop/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Check committed version manifests
        env:
          BUILD_SHA: ${{ steps.identity.outputs.sha }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: python scripts/release.py verify-tree --sha $env:BUILD_SHA --version $env:VERSION

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt -r desktop/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Python regression tests
        run: python -m pytest -q

      - name: Frontend regression tests
        run: node --test tests/*.test.mjs
        working-directory: frontend

      - name: Desktop shell tests
        run: npm test
        working-directory: desktop

      - name: Build offline frontend with the real API
        run: npm run build -- --mode desktop
        working-directory: frontend
        env:
          VITE_USE_MOCK: 'false'

      - name: Freeze exact committed backend and embed build provenance
        run: python desktop/scripts/build-backend.py

      - name: Frozen backend calculations and restart persistence
        run: >-
          python desktop/scripts/smoke-backend.py
          --executable desktop/backend-dist/cbos-backend/cbos-backend.exe
          --output desktop/smoke-output/backend

      - name: Build per-user installer and portable ZIP
        run: npm run dist:win
        working-directory: desktop

      - name: Fetch and verify the pinned official upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python desktop/scripts/download-upgrade-baseline.py
          --output-dir "$env:RUNNER_TEMP/cbos-upgrade-baseline-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Validate fresh install, real in-place upgrade, ZIP launch and database-preserving uninstall
        env:
          BUILD_SHA: ${{ steps.identity.outputs.sha }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: >-
          python desktop/scripts/windows-lifecycle.py
          --installer "desktop/dist/CBOS-$env:VERSION-windows-x64-setup.exe"
          --zip "desktop/dist/CBOS-$env:VERSION-windows-x64.zip"
          --baseline "$env:RUNNER_TEMP/cbos-upgrade-baseline-${{ github.run_id }}-${{ github.run_attempt }}"
          --version $env:VERSION --sha $env:BUILD_SHA
          --output desktop/smoke-output

      - name: Attest successful same-SHA Windows validation
        env:
          BUILD_SHA: ${{ steps.identity.outputs.sha }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: >-
          python scripts/release.py stamp-validation --platform windows
          --sha $env:BUILD_SHA --version $env:VERSION
          --reports desktop/smoke-output --output desktop/dist/windows-validation.json

      - name: Write SHA-256 checksums
        run: |
          $artifacts = @(Get-ChildItem 'desktop/dist' -File | Where-Object { $_.Extension -in '.exe', '.zip' })
          if ($artifacts.Count -ne 2) { throw 'Expected one NSIS installer and one portable ZIP' }
          $checksums = foreach ($file in ($artifacts | Sort-Object Name)) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content 'desktop/dist/SHA256SUMS.txt' -Encoding ascii

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: CBOS-windows-x64-${{ steps.identity.outputs.sha }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS.txt
            desktop/dist/windows-validation.json
          if-no-files-found: error
          compression-level: 0

      - name: Upload smoke reports, visible screenshots and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CBOS-windows-smoke-${{ steps.identity.outputs.sha }}
          path: |
            desktop/smoke-output/
            desktop/backend-build/**/warn-*.txt
            desktop/dist/builder-effective-config.yaml
          if-no-files-found: warn
