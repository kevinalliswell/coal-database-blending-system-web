name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already committed X.Y.Z version (no automatic version edits)'
        required: true
        type: string
      build_sha:
        description: 'Full 40-character commit SHA already merged into main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      image: ${{ steps.identity.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require prepared version and immutable main ancestor
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ inputs.build_sha }}
          VERSION: ${{ inputs.version }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$DISPATCH_REF" = refs/heads/main
          python scripts/release.py preflight --sha "$BUILD_SHA" --version "$VERSION" > preflight.json
          python - <<'PY'
          import json, os
          data = json.load(open('preflight.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for key, value in [('sha',data['commit']),('version',data['version']),('image',data['image'])]:
                  stream.write(f'{key}={value}\n')
          PY

  linux:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_SHA: ${{ needs.preflight.outputs.sha }}
      VERSION: ${{ needs.preflight.outputs.version }}
      IMAGE: ${{ needs.preflight.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/release.py verify-tree --sha "$BUILD_SHA" --version "$VERSION"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Python, frontend and shell regression
        run: |
          python -m pytest -q
          node --test frontend/tests/*.test.mjs
          node --test desktop/tests/*.test.cjs
      - run: npm run build
        working-directory: frontend
        env:
          VITE_USE_MOCK: 'false'
      - name: Build exact Linux image
        run: |
          docker build --platform linux/amd64 --build-arg BUILD_COMMIT="$BUILD_SHA" --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t "$IMAGE:$VERSION" .
      - name: Real fresh and upgraded Docker HTTP validation
        run: |
          python scripts/smoke-docker.py --image "$IMAGE:$VERSION" --output release-evidence --expected-commit "$BUILD_SHA" --expected-version "$VERSION" --expected-platform linux/amd64
      - name: Save tested image and platform evidence
        run: |
          mkdir -p linux-artifact
          docker save "$IMAGE:$VERSION" | gzip > "linux-artifact/cbos-web-$VERSION-docker-image.tar.gz"
          python scripts/release.py stamp-validation --platform linux --sha "$BUILD_SHA" --version "$VERSION" --reports release-evidence --output linux-artifact/linux-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: CBOS-linux-${{ needs.preflight.outputs.sha }}
          path: linux-artifact/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CBOS-linux-diagnostics-${{ needs.preflight.outputs.sha }}
          path: release-evidence/
          if-no-files-found: warn

  windows:
    needs: preflight
    uses: ./.github/workflows/windows-desktop.yml
    with:
      build_sha: ${{ needs.preflight.outputs.sha }}
      version: ${{ needs.preflight.outputs.version }}
    permissions:
      contents: read

  publish:
    needs: [preflight, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_SHA: ${{ needs.preflight.outputs.sha }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: CBOS-linux-${{ needs.preflight.outputs.sha }}
          path: release-input/linux
      - uses: actions/download-artifact@v4
        with:
          name: CBOS-windows-x64-${{ needs.preflight.outputs.sha }}
          path: release-input/windows
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify, stage, download-check, publish and finally promote latest
        run: python scripts/release.py publish --sha "$BUILD_SHA" --version "$VERSION" --inputs release-input --output release-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-manifest-${{ needs.preflight.outputs.sha }}
          path: |
            release-output/build-manifest.json
            release-output/SHA256SUMS.txt
            release-output/validation-summary.md
          if-no-files-found: warn
